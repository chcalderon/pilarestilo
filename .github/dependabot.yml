version: 2

# The "18 CVEs -> 0" incident (see project memory) happened because dependency pins live only in
# the monolith by convention -- the extracted services drifted out of sync silently until a manual
# audit caught it. These entries open the fix themselves. product/inventory/order/payment-service
# were consolidated back into the monolith on 2026-08-30; notification-service is the one that
# remains.
#
# Target branch is develop, not master: PRs go through the normal Docker-verified path before a
# human merges to master, same as every other change -- see CLAUDE.md.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/notification-service
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      notification-service-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
