version: 2

# The "18 CVEs -> 0" incident (see project memory) happened because dependency pins live only in
# the monolith by convention -- the four extracted services drifted out of sync silently until a
# manual audit caught it, payment-service alone carrying nine. These entries open the fix
# themselves instead of waiting for the next manual audit.
#
# Target branch is develop, not master: PRs go through the normal Docker-verified path before a
# human merges to master, same as every other change -- see CLAUDE.md.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/order-service
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      order-service-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/inventory-service
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      inventory-service-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/product-service
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      product-service-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /services/payment-service
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      payment-service-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
