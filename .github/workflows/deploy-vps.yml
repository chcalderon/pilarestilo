name: Deploy VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    # Without this, a CI run completing on ANY branch -- a Dependabot PR against develop, a feature
    # branch -- still queues into deploy-vps-production and cancels a real deploy in progress via
    # cancel-in-progress, even though the job's own `if` below would have skipped it anyway. The
    # cancellation happens before that `if` is ever evaluated. Filtering here stops it from being
    # queued at all.
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "master"
      compose_profiles:
        description: "Optional COMPOSE_PROFILES value (example: cache,microservices,observability,tracing,kafka)"
        required: false
        default: ""
      skip_build:
        description: "Skip docker compose --build"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS over SSH
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'master' }}
          DEPLOY_PROFILES: ${{ github.event.inputs.compose_profiles || secrets.VPS_COMPOSE_PROFILES }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build == 'true' && 'true' || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,DEPLOY_BRANCH,DEPLOY_PROFILES,SKIP_BUILD
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="/opt/pilarestilo"
            fi
            cd "${APP_DIR}"
            bash scripts/deploy/vps_deploy.sh
