name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify, not test: surefire only matches *Test, so `mvn test` skipped the 14
      # Testcontainers-backed *IT classes entirely. They run under failsafe in the
      # integration-test phase. Docker is available on ubuntu-latest runners.
      - name: Run tests
        run: mvn -B verify

      # Non-blocking while the pre-PMD backlog (mostly duplicated literals) gets burned down
      # deliberately -- same "clean as you code" policy as the Sonar quality gate and the
      # frontend ESLint step. Flip to blocking once the backlog in config/pmd-ruleset.xml is
      # clear. Own profile so it doesn't slow the `mvn -B verify` above.
      - name: Lint (PMD, report only)
        run: mvn -B -P pmd org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
        continue-on-error: true

  # The four extracted services were never built here. Their first compilation happened on the VPS,
  # during the deploy, so a broken one surfaced as a failed production deploy rather than a failed
  # pull request -- and their tests, seventy-nine of them, ran nowhere at all. That is the same
  # blind spot that let them ship without the CVE pins the monolith already carried and answer
  # catalogue queries differently from it.
  service-tests:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service, product-service, payment-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn -B verify

  frontend-build:
    name: Frontend Build (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright stays out of CI: e2e/ needs the compose stack running behind Caddy.
      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Non-blocking while the pre-ESLint backlog (mostly nested ternaries and unlabelled
      # form fields) gets burned down deliberately -- same "clean as you code" policy as the
      # Sonar quality gate. Flip to blocking once the backlog in eslint.config.js is clear.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
