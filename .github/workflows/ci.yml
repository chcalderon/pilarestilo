name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify, not test: surefire only matches *Test, so `mvn test` skipped the 14
      # Testcontainers-backed *IT classes entirely. They run under failsafe in the
      # integration-test phase. Docker is available on ubuntu-latest runners.
      - name: Run tests
        run: mvn -B verify

  frontend-build:
    name: Frontend Build (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright stays out of CI: e2e/ needs the compose stack running behind Caddy.
      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
