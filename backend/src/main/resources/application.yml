spring:
  application:
    name: ${SPRING_APPLICATION_NAME:pilar-estilo-backend}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pilarestilo}
    username: ${SPRING_DATASOURCE_USERNAME:pilar}
    password: ${SPRING_DATASOURCE_PASSWORD:pilar}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.pilarestilo.*
            use:
              type:
                headers: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: ${APP_TRACING_ENABLED:false}
    sampling:
      probability: ${APP_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${APP_TRACING_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./media}
  notification:
    provider: ${NOTIFICATION_PROVIDER:LOG}
    email:
      smtp:
        host: ${EMAIL_SMTP_HOST:}
        port: ${EMAIL_SMTP_PORT:}
        username: ${EMAIL_SMTP_USERNAME:}
        password: ${EMAIL_SMTP_PASSWORD:}
        from-email: ${EMAIL_SMTP_FROM_EMAIL:}
        sender-name: ${EMAIL_SMTP_SENDER_NAME:Pilar Estilo}
        auth-enabled: ${EMAIL_SMTP_AUTH_ENABLED:}
        starttls-enabled: ${EMAIL_SMTP_STARTTLS_ENABLED:}
        ssl-enabled: ${EMAIL_SMTP_SSL_ENABLED:}
        to-fallback: ${EMAIL_SMTP_TO_FALLBACK:}
      sendgrid:
        api-base-url: ${SENDGRID_API_BASE_URL:https://api.sendgrid.com}
        api-key: ${SENDGRID_API_KEY:}
        from-email: ${SENDGRID_FROM_EMAIL:}
        sender-name: ${SENDGRID_SENDER_NAME:Pilar Estilo}
        to-fallback: ${SENDGRID_TO_FALLBACK:}
    whatsapp:
      simulated-to: ${WHATSAPP_SIMULATED_TO:-+56900000000}
      simulated-sender: ${WHATSAPP_SIMULATED_SENDER:Pilar Estilo}
      twilio:
        api-base-url: ${WHATSAPP_TWILIO_API_BASE_URL:https://api.twilio.com}
        account-sid: ${WHATSAPP_TWILIO_ACCOUNT_SID:}
        auth-token: ${WHATSAPP_TWILIO_AUTH_TOKEN:}
        from: ${WHATSAPP_TWILIO_FROM:}
        to-fallback: ${WHATSAPP_TWILIO_TO_FALLBACK:-+56900000000}
        sender-alias: ${WHATSAPP_TWILIO_SENDER_ALIAS:Pilar Estilo}
  payment:
    gateway:
      provider: ${PAYMENT_GATEWAY_PROVIDER:STUB}
      webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:}
      stub-checkout-base-url: ${PAYMENT_GATEWAY_STUB_CHECKOUT_BASE_URL:/es/account?tab=orders}
      mercadopago:
        api-base-url: ${PAYMENT_GATEWAY_MP_API_BASE_URL:https://api.mercadopago.com}
        access-token: ${PAYMENT_GATEWAY_MP_ACCESS_TOKEN:}
        success-url: ${PAYMENT_GATEWAY_MP_SUCCESS_URL:}
        pending-url: ${PAYMENT_GATEWAY_MP_PENDING_URL:}
        failure-url: ${PAYMENT_GATEWAY_MP_FAILURE_URL:}
        notification-url: ${PAYMENT_GATEWAY_MP_NOTIFICATION_URL:}
        webhook-token: ${PAYMENT_GATEWAY_MP_WEBHOOK_TOKEN:}
    remote:
      enabled: ${APP_PAYMENT_REMOTE_ENABLED:false}
      base-url: ${APP_PAYMENT_REMOTE_BASE_URL:http://payment-service:8084}
      service-token: ${APP_PAYMENT_REMOTE_SERVICE_TOKEN:}
  system-settings:
    crypto-secret: ${SYSTEM_SETTINGS_CRYPTO_SECRET:${JWT_SECRET:U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}}
  domain-events:
    kafka:
      enabled: ${APP_DOMAIN_EVENTS_KAFKA_ENABLED:false}
      topic-prefix: ${APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX:pe.domain}
      consumer-group-id: ${APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID:pe-backend-domain-events}
      retry-backoff-ms: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS:1500}
      retry-max-attempts: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS:3}
      dlt-suffix: ${APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX:.dlt}
  inventory:
    remote:
      enabled: ${APP_INVENTORY_REMOTE_ENABLED:false}
      base-url: ${APP_INVENTORY_REMOTE_BASE_URL:http://inventory-service:8082}
  order:
    remote:
      enabled: ${APP_ORDER_REMOTE_ENABLED:false}
      write-enabled: ${APP_ORDER_REMOTE_WRITE_ENABLED:false}
      base-url: ${APP_ORDER_REMOTE_BASE_URL:http://order-service:8083}
      service-token: ${APP_ORDER_REMOTE_SERVICE_TOKEN:}
  gateway:
    rate-limit:
      enabled: ${APP_GATEWAY_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
      login-max-requests: ${APP_GATEWAY_RATE_LIMIT_LOGIN_MAX_REQUESTS:12}
      register-max-requests: ${APP_GATEWAY_RATE_LIMIT_REGISTER_MAX_REQUESTS:6}
      webhook-max-requests: ${APP_GATEWAY_RATE_LIMIT_WEBHOOK_MAX_REQUESTS:180}

server:
  port: 8080
