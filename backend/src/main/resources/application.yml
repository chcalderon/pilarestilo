spring:
  application:
    name: ${SPRING_APPLICATION_NAME:pilar-estilo-backend}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pilarestilo}
    username: ${SPRING_DATASOURCE_USERNAME:pilar}
    password: ${SPRING_DATASOURCE_PASSWORD:pilar}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      # Redis is a cache here (@Cacheable / RedisTemplate), never a Spring Data repository store.
      # With the notification module's explicit @EnableJpaRepositories gone, repository auto-scan
      # runs in strict multi-module mode; turning Redis repositories off keeps it from inspecting
      # (and logging about) every JpaRepository.
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}
  jpa:
    hibernate:
      ddl-auto: validate
      # Boot's snake_case defaults, pinned explicitly: a column without an explicit @Column name
      # must resolve created_at, not createdAt.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.pilarestilo.*
            use:
              type:
                headers: true

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    # Boot 4 renamed both of these. The old management.tracing.enabled and
    # management.otlp.tracing.endpoint still parse and bind to nothing.
    export:
      enabled: ${APP_TRACING_ENABLED:false}
    sampling:
      probability: ${APP_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${APP_TRACING_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
  password-reset:
    # Where the reset link points. The storefront origin, no trailing slash.
    link-base-url: ${APP_PASSWORD_RESET_LINK_BASE_URL:http://localhost:4321}
    # Minutes a reset link stays valid. Kept in step with RequestPasswordResetUseCase.TOKEN_TTL.
    token-ttl-minutes: ${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    # Cron for pruning expired reset tokens. Default: daily at 03:30.
    cleanup-cron: ${APP_PASSWORD_RESET_CLEANUP_CRON:0 30 3 * * *}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./media}
  documents:
    # Separate from media on purpose: everything under media.storage-path is served publicly by
    # /api/media/**, and a boleta carries a RUT, a buyer name and amounts.
    storage-path: ${DOCUMENTS_STORAGE_PATH:./documents}
    orphan-sweep:
      # Uploading is a step apart from registering the boleta, so an abandoned drawer leaves a file
      # nothing points at. The age threshold is what keeps the sweep from eating a file still on
      # its way to being claimed.
      cron: ${APP_DOCUMENTS_ORPHAN_SWEEP_CRON:0 30 4 * * *}
      min-age-hours: ${APP_DOCUMENTS_ORPHAN_SWEEP_MIN_AGE_HOURS:24}
  cache:
    redis:
      enabled: ${APP_CACHE_REDIS_ENABLED:false}
      ttl-seconds: ${APP_CACHE_REDIS_TTL_SECONDS:300}
  # Notifications moved to services/notification-service (Kafka-only, own DB). The monolith keeps
  # only the SMTP credentials the password-reset mailer reads directly (EMAIL_SMTP_* env, or
  # system_settings) — no app.notification.* block, no messaging providers here anymore.
  payment:
    gateway:
      provider: ${PAYMENT_GATEWAY_PROVIDER:STUB}
      webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:}
      stub-checkout-base-url: ${PAYMENT_GATEWAY_STUB_CHECKOUT_BASE_URL:/es/account?tab=orders}
      mercadopago:
        api-base-url: ${PAYMENT_GATEWAY_MP_API_BASE_URL:https://api.mercadopago.com}
        access-token: ${PAYMENT_GATEWAY_MP_ACCESS_TOKEN:}
        success-url: ${PAYMENT_GATEWAY_MP_SUCCESS_URL:}
        pending-url: ${PAYMENT_GATEWAY_MP_PENDING_URL:}
        failure-url: ${PAYMENT_GATEWAY_MP_FAILURE_URL:}
        notification-url: ${PAYMENT_GATEWAY_MP_NOTIFICATION_URL:}
        webhook-token: ${PAYMENT_GATEWAY_MP_WEBHOOK_TOKEN:}
  system-settings:
    crypto-secret: ${SYSTEM_SETTINGS_CRYPTO_SECRET:${JWT_SECRET:U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}}
  domain-events:
    kafka:
      enabled: ${APP_DOMAIN_EVENTS_KAFKA_ENABLED:false}
      topic-prefix: ${APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX:pe.domain}
      consumer-group-id: ${APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID:pe-backend-domain-events}
      retry-backoff-ms: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS:1500}
      retry-max-attempts: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS:3}
      dlt-suffix: ${APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX:.dlt}
  analytics:
    posthog:
      # Server side of the storefront funnel (order_created / order_paid). Off unless a project
      # key is set. Same write-only phc_… token the frontend ships; US region by default.
      enabled: ${APP_ANALYTICS_POSTHOG_ENABLED:false}
      host: ${APP_ANALYTICS_POSTHOG_HOST:https://us.i.posthog.com}
      api-key: ${APP_ANALYTICS_POSTHOG_API_KEY:}
      capture-path: ${APP_ANALYTICS_POSTHOG_CAPTURE_PATH:/i/v0/e/}
      timeout-ms: ${APP_ANALYTICS_POSTHOG_TIMEOUT_MS:3000}
  gateway:
    rate-limit:
      enabled: ${APP_GATEWAY_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
      login-max-requests: ${APP_GATEWAY_RATE_LIMIT_LOGIN_MAX_REQUESTS:12}
      register-max-requests: ${APP_GATEWAY_RATE_LIMIT_REGISTER_MAX_REQUESTS:6}
      webhook-max-requests: ${APP_GATEWAY_RATE_LIMIT_WEBHOOK_MAX_REQUESTS:180}
  product-ai:
    enabled: ${APP_PRODUCT_AI_ENABLED:true}
    engine: ${APP_PRODUCT_AI_ENGINE:stub}
    max-attempts: ${APP_PRODUCT_AI_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${APP_PRODUCT_AI_RETRY_BACKOFF_MS:2000}
    worker:
      cron: ${APP_PRODUCT_AI_WORKER_CRON:*/20 * * * * *}
      batch-size: ${APP_PRODUCT_AI_WORKER_BATCH_SIZE:5}
    image:
      web-width: ${APP_PRODUCT_AI_IMAGE_WEB_WIDTH:1024}
      web-height: ${APP_PRODUCT_AI_IMAGE_WEB_HEIGHT:1280}
      web-jpeg-quality: ${APP_PRODUCT_AI_IMAGE_WEB_JPEG_QUALITY:0.88}
      thumb-width: ${APP_PRODUCT_AI_IMAGE_THUMB_WIDTH:320}
      thumb-height: ${APP_PRODUCT_AI_IMAGE_THUMB_HEIGHT:400}
      thumb-jpeg-quality: ${APP_PRODUCT_AI_IMAGE_THUMB_JPEG_QUALITY:0.82}
    openai:
      base-url: ${APP_PRODUCT_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${APP_PRODUCT_AI_OPENAI_API_KEY:}
      infer-model: ${APP_PRODUCT_AI_OPENAI_INFER_MODEL:gpt-4.1-mini}
      image-model: ${APP_PRODUCT_AI_OPENAI_IMAGE_MODEL:gpt-image-1}
      model: ${APP_PRODUCT_AI_OPENAI_MODEL:gpt-image-1}
  social-publishing:
    meta:
      instagram:
        user-id: ${APP_SOCIAL_PUBLISHING_META_INSTAGRAM_USER_ID:}
        access-token: ${APP_SOCIAL_PUBLISHING_META_INSTAGRAM_ACCESS_TOKEN:}
        base-url: ${APP_SOCIAL_PUBLISHING_META_INSTAGRAM_BASE_URL:https://graph.instagram.com/v23.0}
      facebook:
        page-id: ${APP_SOCIAL_PUBLISHING_META_FACEBOOK_PAGE_ID:}
        page-access-token: ${APP_SOCIAL_PUBLISHING_META_FACEBOOK_PAGE_ACCESS_TOKEN:}
        base-url: ${APP_SOCIAL_PUBLISHING_META_FACEBOOK_BASE_URL:https://graph.facebook.com/v23.0}
      public-media-base-url: ${APP_SOCIAL_PUBLISHING_META_PUBLIC_MEDIA_BASE_URL:}

server:
  port: 8080
