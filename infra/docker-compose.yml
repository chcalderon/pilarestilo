services:
  postgres:
    image: postgres:16-alpine
    container_name: pe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pilarestilo}
      POSTGRES_USER: ${POSTGRES_USER:-pilar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
    volumes:
      - pe_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pilar} -d ${POSTGRES_DB:-pilarestilo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pe_redis
    profiles: ["cache"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - pe_redis_data:/data
    networks:
      - pe_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: pe_kafka
    profiles: ["kafka"]
    restart: unless-stopped
    # Heap caps across the JVM services (this file). Without them every JVM sees the host's
    # 12 GB and MaxRAMPercentage lets its heap grow toward ~3 GB; six of them overcommit and a
    # ProductUpdated fan-out makes them all GC at once (prod load hit 87, 2026-08-30). mem_limit
    # sets the cgroup ceiling; JAVA_TOOL_OPTIONS makes the JVM size its heap against that ceiling.
    # Deliberately tight for a 12 GB box — revisit if a service OOMs or if the box is upsized.
    mem_limit: 1300m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pe_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g          # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-${PUBLIC_GOOGLE_CLIENT_ID:-}}
      SYSTEM_SETTINGS_CRYPTO_SECRET: ${SYSTEM_SETTINGS_CRYPTO_SECRET:-U2VjcmV0U3lzdGVtU2V0dGluZ3MxMjM0NTY3ODkw}
      MEDIA_STORAGE_PATH: /app/media
      # Never under /app/media: that whole tree is served publicly by /api/media/**.
      DOCUMENTS_STORAGE_PATH: /app/documents
      APP_CACHE_REDIS_ENABLED: ${APP_CACHE_REDIS_ENABLED:-false}
      APP_CACHE_REDIS_TTL_SECONDS: ${APP_CACHE_REDIS_TTL_SECONDS:-300}
      # SMTP for SmtpPasswordResetMailer (shared/auth). It reads system_settings first, then these
      # as the fallback. All other messaging config moved to the notification-service block.
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM_EMAIL: ${EMAIL_SMTP_FROM_EMAIL:-}
      EMAIL_SMTP_SENDER_NAME: ${EMAIL_SMTP_SENDER_NAME:-Pilar Estilo}
      EMAIL_SMTP_AUTH_ENABLED: ${EMAIL_SMTP_AUTH_ENABLED:-}
      EMAIL_SMTP_STARTTLS_ENABLED: ${EMAIL_SMTP_STARTTLS_ENABLED:-}
      EMAIL_SMTP_SSL_ENABLED: ${EMAIL_SMTP_SSL_ENABLED:-}
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-STUB}
      PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:-}
      PAYMENT_GATEWAY_STUB_CHECKOUT_BASE_URL: ${PAYMENT_GATEWAY_STUB_CHECKOUT_BASE_URL:-/es/account?tab=orders}
      PAYMENT_GATEWAY_MP_API_BASE_URL: ${PAYMENT_GATEWAY_MP_API_BASE_URL:-https://api.mercadopago.com}
      PAYMENT_GATEWAY_MP_ACCESS_TOKEN: ${PAYMENT_GATEWAY_MP_ACCESS_TOKEN:-}
      PAYMENT_GATEWAY_MP_SUCCESS_URL: ${PAYMENT_GATEWAY_MP_SUCCESS_URL:-}
      PAYMENT_GATEWAY_MP_PENDING_URL: ${PAYMENT_GATEWAY_MP_PENDING_URL:-}
      PAYMENT_GATEWAY_MP_FAILURE_URL: ${PAYMENT_GATEWAY_MP_FAILURE_URL:-}
      PAYMENT_GATEWAY_MP_NOTIFICATION_URL: ${PAYMENT_GATEWAY_MP_NOTIFICATION_URL:-}
      PAYMENT_GATEWAY_MP_WEBHOOK_TOKEN: ${PAYMENT_GATEWAY_MP_WEBHOOK_TOKEN:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APP_DOMAIN_EVENTS_KAFKA_ENABLED: ${APP_DOMAIN_EVENTS_KAFKA_ENABLED:-false}
      APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX: ${APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX:-pe.domain}
      APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID: ${APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID:-pe-backend-domain-events}
      APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS:-1500}
      APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS:-3}
      APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX: ${APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX:-.dlt}
      APP_INVENTORY_REMOTE_ENABLED: ${APP_INVENTORY_REMOTE_ENABLED:-false}
      APP_INVENTORY_REMOTE_BASE_URL: ${APP_INVENTORY_REMOTE_BASE_URL:-http://inventory-service:8082}
      APP_ORDER_REMOTE_ENABLED: ${APP_ORDER_REMOTE_ENABLED:-false}
      APP_ORDER_REMOTE_WRITE_ENABLED: ${APP_ORDER_REMOTE_WRITE_ENABLED:-false}
      APP_ORDER_REMOTE_BASE_URL: ${APP_ORDER_REMOTE_BASE_URL:-http://order-service:8083}
      APP_ORDER_REMOTE_SERVICE_TOKEN: ${APP_ORDER_REMOTE_SERVICE_TOKEN:-order-service-internal-token}
      APP_PAYMENT_REMOTE_ENABLED: ${APP_PAYMENT_REMOTE_ENABLED:-false}
      APP_PAYMENT_REMOTE_BASE_URL: ${APP_PAYMENT_REMOTE_BASE_URL:-http://payment-service:8084}
      APP_PAYMENT_REMOTE_SERVICE_TOKEN: ${APP_PAYMENT_REMOTE_SERVICE_TOKEN:-payment-service-internal-token}
      APP_GATEWAY_RATE_LIMIT_ENABLED: ${APP_GATEWAY_RATE_LIMIT_ENABLED:-true}
      APP_GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${APP_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_GATEWAY_RATE_LIMIT_LOGIN_MAX_REQUESTS: ${APP_GATEWAY_RATE_LIMIT_LOGIN_MAX_REQUESTS:-12}
      APP_GATEWAY_RATE_LIMIT_REGISTER_MAX_REQUESTS: ${APP_GATEWAY_RATE_LIMIT_REGISTER_MAX_REQUESTS:-6}
      APP_GATEWAY_RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS: ${APP_GATEWAY_RATE_LIMIT_FORGOT_PASSWORD_MAX_REQUESTS:-5}
      APP_GATEWAY_RATE_LIMIT_WEBHOOK_MAX_REQUESTS: ${APP_GATEWAY_RATE_LIMIT_WEBHOOK_MAX_REQUESTS:-180}
      APP_PASSWORD_RESET_LINK_BASE_URL: ${APP_PASSWORD_RESET_LINK_BASE_URL:-https://${DOMAIN:-localhost}}
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
      APP_PRODUCT_AI_ENABLED: ${APP_PRODUCT_AI_ENABLED:-true}
      APP_PRODUCT_AI_ENGINE: ${APP_PRODUCT_AI_ENGINE:-openai_backend}
      APP_PRODUCT_AI_MAX_ATTEMPTS: ${APP_PRODUCT_AI_MAX_ATTEMPTS:-3}
      APP_PRODUCT_AI_RETRY_BACKOFF_MS: ${APP_PRODUCT_AI_RETRY_BACKOFF_MS:-2000}
      APP_PRODUCT_AI_WORKER_CRON: ${APP_PRODUCT_AI_WORKER_CRON:-*/20 * * * * *}
      APP_PRODUCT_AI_WORKER_BATCH_SIZE: ${APP_PRODUCT_AI_WORKER_BATCH_SIZE:-5}
      APP_PRODUCT_AI_IMAGE_WEB_WIDTH: ${APP_PRODUCT_AI_IMAGE_WEB_WIDTH:-1024}
      APP_PRODUCT_AI_IMAGE_WEB_HEIGHT: ${APP_PRODUCT_AI_IMAGE_WEB_HEIGHT:-1280}
      APP_PRODUCT_AI_IMAGE_WEB_JPEG_QUALITY: ${APP_PRODUCT_AI_IMAGE_WEB_JPEG_QUALITY:-0.88}
      APP_PRODUCT_AI_IMAGE_THUMB_WIDTH: ${APP_PRODUCT_AI_IMAGE_THUMB_WIDTH:-320}
      APP_PRODUCT_AI_IMAGE_THUMB_HEIGHT: ${APP_PRODUCT_AI_IMAGE_THUMB_HEIGHT:-400}
      APP_PRODUCT_AI_IMAGE_THUMB_JPEG_QUALITY: ${APP_PRODUCT_AI_IMAGE_THUMB_JPEG_QUALITY:-0.82}
      APP_PRODUCT_AI_OPENAI_BASE_URL: ${APP_PRODUCT_AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_PRODUCT_AI_OPENAI_API_KEY: ${APP_PRODUCT_AI_OPENAI_API_KEY:-}
      APP_PRODUCT_AI_OPENAI_INFER_MODEL: ${APP_PRODUCT_AI_OPENAI_INFER_MODEL:-gpt-4.1-mini}
      APP_PRODUCT_AI_OPENAI_IMAGE_MODEL: ${APP_PRODUCT_AI_OPENAI_IMAGE_MODEL:-gpt-image-1}
      APP_PRODUCT_AI_OPENAI_MODEL: ${APP_PRODUCT_AI_OPENAI_MODEL:-gpt-image-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/media:/app/media
      - ./storage/documents:/app/documents
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    container_name: pe_product_service
    profiles: ["microservices"]
    restart: unless-stopped
    mem_limit: 820m         # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      APP_DB_READ_REPLICA_ENABLED: ${APP_DB_READ_REPLICA_ENABLED:-false}
      APP_DB_READ_REPLICA_URL: ${APP_DB_READ_REPLICA_URL:-}
      APP_DB_READ_REPLICA_USERNAME: ${APP_DB_READ_REPLICA_USERNAME:-}
      APP_DB_READ_REPLICA_PASSWORD: ${APP_DB_READ_REPLICA_PASSWORD:-}
      APP_DB_READ_REPLICA_DRIVER_CLASS_NAME: ${APP_DB_READ_REPLICA_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      SERVER_PORT: "8081"
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    container_name: pe_inventory_service
    profiles: ["microservices"]
    restart: unless-stopped
    mem_limit: 820m         # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      SERVER_PORT: "8082"
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    container_name: pe_order_service
    profiles: ["microservices"]
    restart: unless-stopped
    mem_limit: 1g           # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
      APP_ORDER_INTERNAL_TOKEN: ${APP_ORDER_REMOTE_SERVICE_TOKEN:-order-service-internal-token}
      APP_INVENTORY_REMOTE_BASE_URL: ${APP_INVENTORY_REMOTE_BASE_URL:-http://inventory-service:8082}
      SERVER_PORT: "8083"
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    container_name: pe_payment_service
    profiles: ["microservices"]
    restart: unless-stopped
    mem_limit: 820m         # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
      APP_PAYMENT_INTERNAL_TOKEN: ${APP_PAYMENT_REMOTE_SERVICE_TOKEN:-payment-service-internal-token}
      SERVER_PORT: "8084"
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: pe_notification_service
    profiles: ["microservices"]
    restart: unless-stopped
    mem_limit: 1g           # heap cap — see the note on the kafka service
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: "8085"
      # Shared pilarestilo database, read-only view (orders/users/payments/documents/returns/settings).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pilarestilo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      # Owned notifications database.
      APP_NOTIFICATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_NOTIFICATIONS_DB:-pilarestilo_notifications}
      APP_NOTIFICATION_DATASOURCE_USERNAME: ${POSTGRES_USER:-pilar}
      APP_NOTIFICATION_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pilar}
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0U2VjcmV0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
      SYSTEM_SETTINGS_CRYPTO_SECRET: ${SYSTEM_SETTINGS_CRYPTO_SECRET:-U2VjcmV0U3lzdGVtU2V0dGluZ3MxMjM0NTY3ODkw}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APP_DOMAIN_EVENTS_KAFKA_ENABLED: ${APP_DOMAIN_EVENTS_KAFKA_ENABLED:-false}
      APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX: ${APP_DOMAIN_EVENTS_KAFKA_TOPIC_PREFIX:-pe.domain}
      # Its own consumer group — NOT the backend's. Hardcoded so the shipped .env's
      # APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID (pe-backend-domain-events) cannot leak in.
      APP_DOMAIN_EVENTS_KAFKA_CONSUMER_GROUP_ID: pe-notification-service
      APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_BACKOFF_MS:-1500}
      APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS: ${APP_DOMAIN_EVENTS_KAFKA_RETRY_MAX_ATTEMPTS:-3}
      APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX: ${APP_DOMAIN_EVENTS_KAFKA_DLT_SUFFIX:-.dlt}
      # Kafka listeners on. Flip false to roll the cutover back (with the backend flag flipped true).
      APP_NOTIFICATION_LISTENERS_ENABLED: ${APP_NOTIFICATION_LISTENERS_ENABLED:-true}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-LOG}
      NOTIFICATION_N8N_WEBHOOK_URL: ${NOTIFICATION_N8N_WEBHOOK_URL:-}
      NOTIFICATION_N8N_API_KEY: ${NOTIFICATION_N8N_API_KEY:-}
      NOTIFICATION_N8N_TOKEN_HEADER_NAME: ${NOTIFICATION_N8N_TOKEN_HEADER_NAME:-X-PE-N8N-TOKEN}
      WHATSAPP_SIMULATED_TO: ${WHATSAPP_SIMULATED_TO:-+56900000000}
      WHATSAPP_SIMULATED_SENDER: ${WHATSAPP_SIMULATED_SENDER:-Pilar Estilo}
      WHATSAPP_TWILIO_API_BASE_URL: ${WHATSAPP_TWILIO_API_BASE_URL:-https://api.twilio.com}
      WHATSAPP_TWILIO_ACCOUNT_SID: ${WHATSAPP_TWILIO_ACCOUNT_SID:-}
      WHATSAPP_TWILIO_AUTH_TOKEN: ${WHATSAPP_TWILIO_AUTH_TOKEN:-}
      WHATSAPP_TWILIO_FROM: ${WHATSAPP_TWILIO_FROM:-}
      WHATSAPP_TWILIO_TO_FALLBACK: ${WHATSAPP_TWILIO_TO_FALLBACK:-+56900000000}
      WHATSAPP_TWILIO_SENDER_ALIAS: ${WHATSAPP_TWILIO_SENDER_ALIAS:-Pilar Estilo}
      SENDGRID_API_BASE_URL: ${SENDGRID_API_BASE_URL:-https://api.sendgrid.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_SENDER_NAME: ${SENDGRID_SENDER_NAME:-Pilar Estilo}
      SENDGRID_TO_FALLBACK: ${SENDGRID_TO_FALLBACK:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM_EMAIL: ${EMAIL_SMTP_FROM_EMAIL:-}
      EMAIL_SMTP_SENDER_NAME: ${EMAIL_SMTP_SENDER_NAME:-Pilar Estilo}
      EMAIL_SMTP_AUTH_ENABLED: ${EMAIL_SMTP_AUTH_ENABLED:-}
      EMAIL_SMTP_STARTTLS_ENABLED: ${EMAIL_SMTP_STARTTLS_ENABLED:-}
      EMAIL_SMTP_SSL_ENABLED: ${EMAIL_SMTP_SSL_ENABLED:-}
      EMAIL_SMTP_TO_FALLBACK: ${EMAIL_SMTP_TO_FALLBACK:-}
      APP_TRACING_ENABLED: ${APP_TRACING_ENABLED:-false}
      APP_TRACING_OTLP_ENDPOINT: ${APP_TRACING_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_TRACING_SAMPLING_PROBABILITY: ${APP_TRACING_SAMPLING_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pe_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    container_name: pe_frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8080/api}
      INTERNAL_PRODUCTS_API_BASE_URL: ${INTERNAL_PRODUCTS_API_BASE_URL:-http://product-service:8081/api}
      PUBLIC_WHATSAPP_PHONE: ${PUBLIC_WHATSAPP_PHONE:-+56900000000}
      PUBLIC_WHATSAPP_MESSAGE_ES: ${PUBLIC_WHATSAPP_MESSAGE_ES:-Hola Pilar Estilo, quiero ayuda con una compra.}
      PUBLIC_WHATSAPP_MESSAGE_EN: ${PUBLIC_WHATSAPP_MESSAGE_EN:-Hi Pilar Estilo, I need help with a purchase.}
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    networks:
      - pe_net

  caddy:
    image: caddy:2-alpine
    container_name: pe_caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - pe_net

  prometheus:
    image: prom/prometheus:latest
    container_name: pe_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pe_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - pe_net

  grafana:
    image: grafana/grafana:latest
    container_name: pe_grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - pe_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - pe_net

  tempo:
    image: grafana/tempo:2.7.2
    container_name: pe_tempo
    profiles: ["observability", "tracing"]
    restart: unless-stopped
    user: "0:0"
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - pe_tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - pe_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    container_name: pe_otel_collector
    profiles: ["observability", "tracing"]
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/collector.yml
    volumes:
      - ./monitoring/otel/collector.yml:/etc/otelcol-contrib/collector.yml:ro
    depends_on:
      - tempo
    networks:
      - pe_net

  # ── Code quality ────────────────────────────────────────────────────────────
  # Its own profile, and deliberately not part of the app stack: it is a tool for looking at the
  # code, not something the shop runs. `docker compose --profile quality up -d sonarqube`.
  sonar-db:
    image: postgres:16-alpine
    container_name: pe_sonar_db
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      # A local folder rather than a named volume: the analysis history and the tokens are worth
      # keeping across `docker compose down -v`, and worth being able to look at.
      - ./storage/sonar/db:/var/lib/postgresql/data
    networks:
      - pe_net

  sonarqube:
    image: sonarqube:community
    container_name: pe_sonarqube
    profiles: ["quality"]
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Elasticsearch inside the image refuses to bootstrap-check on a Docker Desktop host.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - ./storage/sonar/data:/opt/sonarqube/data
      - ./storage/sonar/extensions:/opt/sonarqube/extensions
      - ./storage/sonar/logs:/opt/sonarqube/logs
    networks:
      - pe_net

networks:
  pe_net:
    driver: bridge

volumes:
  pe_pgdata:
  pe_redis_data:
  pe_prometheus_data:
  pe_grafana_data:
  pe_tempo_data:
  caddy_data:
  caddy_config:
