server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:inventory-service}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pilarestilo}
    username: ${SPRING_DATASOURCE_USERNAME:pilar}
    password: ${SPRING_DATASOURCE_PASSWORD:pilar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    # Boot 4 renamed both of these. The old management.tracing.enabled and
    # management.otlp.tracing.endpoint still parse and bind to nothing.
    export:
      enabled: ${APP_TRACING_ENABLED:false}
    sampling:
      probability: ${APP_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${APP_TRACING_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
