server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:product-service}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pilarestilo}
    username: ${SPRING_DATASOURCE_USERNAME:pilar}
    password: ${SPRING_DATASOURCE_PASSWORD:pilar}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

app:
  datasource:
    read-replica:
      enabled: ${APP_DB_READ_REPLICA_ENABLED:false}
      url: ${APP_DB_READ_REPLICA_URL:}
      username: ${APP_DB_READ_REPLICA_USERNAME:}
      password: ${APP_DB_READ_REPLICA_PASSWORD:}
      driver-class-name: ${APP_DB_READ_REPLICA_DRIVER_CLASS_NAME:org.postgresql.Driver}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    # Boot 4 renamed both of these. The old management.tracing.enabled and
    # management.otlp.tracing.endpoint still parse and bind to nothing.
    export:
      enabled: ${APP_TRACING_ENABLED:false}
    sampling:
      probability: ${APP_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${APP_TRACING_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
